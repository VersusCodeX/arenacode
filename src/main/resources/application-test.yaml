# Perfil de testes automatizados.
# Nunca deve apontar para banco de produção.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/arenacode
    username: arenacode
    password: local-dev-password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.arenacode: INFO
    org.springframework: WARN
    org.hibernate: WARN