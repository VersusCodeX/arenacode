# Perfil de testes automatizados.
# Nunca deve apontar para banco de produção.
# Preparado para uso futuro com Testcontainers (nenhum datasource configurado ainda).

spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/arenacode
    username: arenacode
    password: local-dev-password
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.arenacode: INFO
    org.springframework: WARN
    org.hibernate: WARN
