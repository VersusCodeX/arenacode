# Perfil de testes automatizados.
# Nunca deve apontar para banco de produção.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/arenacode
    username: arenacode
    password: local-dev-password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: WARN
    com.arenacode: INFO
    org.springframework: WARN
    org.hibernate: WARN