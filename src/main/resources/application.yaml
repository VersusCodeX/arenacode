# Perfil de desenvolvimento local.
# Nenhuma credencial real deve ser inserida aqui.
# Todas as configurações sensíveis devem vir de variáveis de ambiente (.env local, nunca commitado).
#
# Os valores abaixo (localhost:5432/arenacode, usuário/senha "arenacode") são apenas
# defaults de conveniência para desenvolvimento local. Sobrescreva via DATABASE_URL,
# DATABASE_USERNAME e DATABASE_PASSWORD no seu .env local quando necessário.

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arenacode}
    username: ${DATABASE_USERNAME:arenacode}
    password: ${DATABASE_PASSWORD:local-dev-password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
  jpa:
    hibernate:
      # Flyway é a única fonte do schema; o Hibernate apenas valida (ADR 0002).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Valor de conveniência apenas para desenvolvimento local. NUNCA usar em produção.
# Sobrescreva via JWT_SECRET no seu .env sempre que possível.
app:
  jwt:
    secret: ${JWT_SECRET:insecure-dev-only-secret-do-not-use-in-production}
    issuer: ${APP_JWT_ISSUER:arenacode.dev}
    access-token-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.arenacode: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG