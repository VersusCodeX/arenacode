spring:
  application:
    name: arenacode
  profiles:
    default: dev
  # TEMPORÁRIO: nenhum datasource foi conectado ainda nesta etapa do projeto.
  # As autoconfigurações abaixo são desativadas para permitir que o contexto Spring
  # suba (e os testes passem) sem um PostgreSQL real disponível.
  # Remover esta lista de exclusões quando spring.datasource.* for configurado
  # com credenciais reais (via variáveis de ambiente) em um commit futuro.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.arenacode: INFO
