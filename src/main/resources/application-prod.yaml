# Perfil de produção.
# NENHUMA senha, secret ou URL concreta deve ser definida neste arquivo.
# Todos os valores sensíveis devem ser fornecidos via variáveis de ambiente no ambiente de execução.
#
# Variáveis obrigatórias neste perfil (ver docs/operations/configuration.md):
#   - DATABASE_URL
#   - DATABASE_USERNAME
#   - DATABASE_PASSWORD
#   - SPRING_PROFILES_ACTIVE=prod
#   - CORS_ALLOWED_ORIGINS
#   - SERVER_PORT (opcional, default 8080)

spring:
  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.arenacode: INFO
    org.springframework: WARN
    org.hibernate: WARN
