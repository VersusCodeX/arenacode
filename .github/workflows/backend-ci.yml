name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check code formatting
        run: ./gradlew spotlessCheck

      - name: Run tests
        run: ./gradlew test

      - name: Run static analysis (SpotBugs)
        run: ./gradlew spotbugsMain

      - name: Build JAR
        run: ./gradlew bootJar

      # Nota: Nao rodamos ./gradlew check aqui porque ele duplicaria
      # spotlessCheck, spotbugsMain e test ja executados acima.
      # O workflow atual ja cobre todas as verificacoes de qualidade.

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/main/
          retention-days: 7

      - name: Upload Gradle build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-report
          path: build/reports/
          retention-days: 7
